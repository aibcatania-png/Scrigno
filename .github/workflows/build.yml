name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  NODE_VERSION: '22'

jobs:
  test:
    name: Test (web, estensione)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}' }
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: |
          set -o pipefail
          { node tests/core.test.js && node tests/ui.test.js && python3 tools/build_extension.py && node tests/extension.test.js; } 2>&1 | tee ci.log
      - if: failure()
        run: tools/ci_report.sh ci.log

  extension:
    name: Estensione browser
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/configure.py && python3 tools/build_extension.py
      - uses: actions/upload-artifact@v4
        with: { name: estensione, path: 'dist/extension/*.zip' }

  pages:
    name: Web app e pagina di accesso (GitHub Pages)
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    permissions: { contents: read, pages: write, id-token: write }
    environment: { name: github-pages, url: '${{ steps.deploy.outputs.page_url }}' }
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/configure.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: web }
      - id: deploy
        uses: actions/deploy-pages@v4

  android:
    name: Android (APK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.11.1' }
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}' }
      - run: python3 tools/configure.py
      - name: Chiave di firma
        env: { KS: '${{ secrets.ANDROID_KEYSTORE_BASE64 }}' }
        run: |
          if [ -n "$KS" ]; then echo "$KS" | base64 -d > "$RUNNER_TEMP/scrigno.jks"; echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/scrigno.jks" >> "$GITHUB_ENV"; fi
      - name: Test e build
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: '${{ secrets.ANDROID_KEYSTORE_PASSWORD }}'
          ANDROID_KEY_ALIAS: '${{ secrets.ANDROID_KEY_ALIAS }}'
          SCRIGNO_KT_OUT: '${{ runner.temp }}'
        run: |
          set -o pipefail
          gradle --no-daemon testReleaseUnitTest assembleRelease 2>&1 | tee ../ci.log
      - if: failure()
        run: tools/ci_report.sh ci.log 120
      - run: node tests/native-compat.test.js "$RUNNER_TEMP" kt
      - run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk "out/Scrigno-$(python3 -c "import json;print(json.load(open('scrigno.config.json'))['version'])")-android.apk"
      - uses: actions/upload-artifact@v4
        with: { name: android, path: out/*.apk }

  desktop:
    name: Desktop (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, flag: --linux }
          - { os: windows-latest, flag: --win }
          - { os: macos-latest, flag: --mac }
    runs-on: ${{ matrix.os }}
    defaults: { run: { shell: bash } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}' }
      - run: python3 tools/configure.py || python tools/configure.py
      - run: rm -rf desktop/web && cp -r web desktop/web
      - run: npm install --no-audit --no-fund
        working-directory: desktop
      - run: |
          set -o pipefail
          if [ "$RUNNER_OS" = macOS ]; then
            # l'app viene impacchettata da electron-builder, il DMG creato direttamente con hdiutil
            npx electron-builder --mac --publish never 2>&1 | tee ../ci.log
            V=$(node -p "require('./package.json').version")
            for d in dist/mac-arm64:arm64 dist/mac:x64; do
              src=${d%%:*}; arch=${d##*:}
              rm -rf stage && mkdir stage && cp -R "$src/Scrigno.app" stage/ && ln -s /Applications stage/Applications
              hdiutil create -volname "Scrigno" -srcfolder stage -ov -format UDZO "dist/Scrigno-$V-mac-$arch.dmg" 2>&1 | tee -a ../ci.log
            done
          else
            npx electron-builder ${{ matrix.flag }} --publish never 2>&1 | tee ../ci.log
          fi
        working-directory: desktop
        env: { CSC_IDENTITY_AUTO_DISCOVERY: 'false' }
      - if: failure()
        run: tools/ci_report.sh ci.log
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: |
            desktop/dist/*.exe
            desktop/dist/*.dmg
            desktop/dist/*.AppImage
            desktop/dist/*.deb

  ios:
    name: iOS
    # Solo su richiesta manuale (Actions › Build › Run workflow): serve un account Apple Developer.
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-15
    env:
      HAS_SIGNING: ${{ secrets.ASC_KEY_ID != '' && secrets.APPLE_TEAM_ID != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}' }
      - name: Test del nucleo Swift
        working-directory: ios/ScrignoCore
        env: { SCRIGNO_SWIFT_OUT: '${{ runner.temp }}' }
        run: swift test
      - run: node tests/native-compat.test.js "$RUNNER_TEMP" swift
      - run: brew install xcodegen
      - run: python3 tools/configure.py
      - run: echo "APP_ID=$(python3 -c "import json;print(json.load(open('scrigno.config.json'))['appId'])")" >> "$GITHUB_ENV"
      - run: xcodegen generate
        working-directory: ios
      - name: Compilazione di verifica (simulatore)
        if: env.HAS_SIGNING != 'true'
        run: |
          xcodebuild -project ios/Scrigno.xcodeproj -scheme Scrigno -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            SCRIGNO_APP_ID="$APP_ID" CODE_SIGNING_ALLOWED=NO build -quiet
      - name: Archivio firmato e invio a TestFlight
        if: env.HAS_SIGNING == 'true'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          KEY="$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8"
          printf '%s' "$ASC_KEY_P8" > "$KEY"
          AUTH=(-allowProvisioningUpdates -authenticationKeyPath "$KEY" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID")
          xcodebuild -project ios/Scrigno.xcodeproj -scheme Scrigno -configuration Release -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Scrigno.xcarchive" archive \
            SCRIGNO_APP_ID="$APP_ID" DEVELOPMENT_TEAM="$TEAM" CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" "${AUTH[@]}" -quiet
          cat > "$RUNNER_TEMP/export.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM</string>
            <key>signingStyle</key><string>automatic</string>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Scrigno.xcarchive" -exportOptionsPlist "$RUNNER_TEMP/export.plist" \
            -exportPath "$RUNNER_TEMP/export" "${AUTH[@]}"

  release:
    name: Pubblica la release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [extension, android, desktop]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: files, merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with:
          files: files/*
          generate_release_notes: true
